{% set name = "wordcloud" %}
{% set version = "1.9.6" %}
{% set tests_to_deselect = "--deselect=test/test_wordcloud_cli.py::test_cli_as_executable" %}

# >       assert ret_code == expected_exit_code
# E       assert 2 == 1
package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: df17c468ff903bd0aba4f87c6540745d13a4931220dd4937cb363ad85a4771b9

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<39]
  entry_points:
    - wordcloud_cli = wordcloud.__main__:main

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - python
    - pip
    - setuptools
    - cython >=0.29.33
    - setuptools-scm
    - numpy {{ numpy }}
    - numpy >=2.0.0
  run:
    - python
    - pillow
    # Numpy >=1.19 in specified in the upstream but numpy>2 version will be inherited from the run export
    - numpy
    - matplotlib-base
    # requirements.txt
    - cython
    - {{ pin_compatible('numpy') }}

test:
  source_files:
    - test
  imports:
    - wordcloud
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - wordcloud_cli --help
    - pytest -v test {{ tests_to_deselect }}

about:
  home: https://github.com/amueller/word_cloud
  license: MIT
  license_file: LICENSE
  license_family: MIT
  summary: A little word cloud generator in Python
  description: |
    A little word cloud generator in Python.
  dev_url: https://github.com/amueller/word_cloud
  doc_url: https://amueller.github.io/word_cloud

extra:
  recipe-maintainers:
    - amueller
    - ericdill
    - ocefpaf
